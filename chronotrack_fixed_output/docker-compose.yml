version: '3.9'
services:
  mongodb:
    image: mongo:7.0
    container_name: ct_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: ct_backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=chronotrack
      - JWT_SECRET=chronotrack-super-secret-change-this
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: ct_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:
